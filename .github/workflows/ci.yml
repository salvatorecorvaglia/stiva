name: CI

on:
  workflow_call:
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2

  web-lint:
    name: Console JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: python3 -m unittest discover -s scripts/tests -v

  vulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f

  test:
    name: Test (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shard: 0
          - os: windows-2025
            shard: 1
          - os: windows-2025
            shard: 2
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: matrix.os == 'windows-2025'
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests with coverage (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: go test -timeout=10m -race "-coverprofile=coverage.out" "-covermode=atomic" "-coverpkg=./..." ./...

      - name: Run tests (other platforms)
        if: matrix.os != 'ubuntu-24.04'
        run: python scripts/test-windows.py --shard ${{ matrix.shard }} --shards 2

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          if [[ ! "$total" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Missing or invalid total coverage"
            exit 1
          fi
          echo "Total coverage: ${total}%"
          floor=60.0
          awk -v t="$total" -v f="$floor" 'BEGIN { if (t+0 < f+0) { printf "Coverage %.1f%% is below the %.1f%% floor\n", t, f; exit 1 } }'

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

      - name: Retain Windows test timings
        if: ${{ always() && matrix.os == 'windows-2025' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-test-timings-${{ matrix.shard }}
          path: test-results.jsonl
          if-no-files-found: ignore
          retention-days: 7

  image-smoke:
    name: Container S3 and crash recovery (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install awscli==1.42.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: stiva:ci
          cache-from: type=gha,scope=smoke-${{ matrix.arch }}
          cache-to: type=gha,scope=smoke-${{ matrix.arch }},mode=max
      - run: bash scripts/image-smoke.sh
        env:
          STIVA_TEST_IMAGE: stiva:ci
          AWS_DEFAULT_REGION: us-east-1
      - run: bash scripts/disk-full-smoke.sh
        env:
          STIVA_TEST_IMAGE: stiva:ci
      - run: bash scripts/backup-smoke.sh
        env:
          STIVA_TEST_IMAGE: stiva:ci

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate GitHub workflows
        run: actionlint -color

  release-package:
    name: Validate and package release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Select final-version or snapshot packaging
        id: packaging
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo 'args=release --skip=publish --clean' >> "$GITHUB_OUTPUT"
          else
            echo 'args=release --snapshot --clean' >> "$GITHUB_OUTPUT"
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.packaging.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify packaged archives
        run: |
          (cd dist && sha256sum --check checksums.txt)
          for archive in dist/*.tar.gz; do tar -tzf "$archive"; done
          for archive in dist/*.zip; do unzip -t "$archive"; done
      - name: Retain final-version archives
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
