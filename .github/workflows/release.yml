name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate tag and release notes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Extract release notes for tag from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          awk -v ver="$VERSION" '
            /^## / {
              heading = $2
              gsub(/[][]/, "", heading)
              sub(/^v/, "", heading)
              selected = (heading == ver)
              next
            }
            selected { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/RELEASE_NOTES.md"; then
            echo "::error::Missing release notes in CHANGELOG.md for $VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: ${{ runner.temp }}/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Download final-version archives verified by CI
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-assets
          path: dist
      - name: Verify archive integrity and release version
        run: |
          (cd dist && sha256sum --check checksums.txt)
          version="${GITHUB_REF_NAME#v}"
          for file in dist/*.tar.gz dist/*.zip; do
            [[ "$(basename "$file")" == "stiva_${version}_"* ]] || exit 1
          done
      - name: Publish verified release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Stiva $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" --prerelease="$prerelease"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"

  docker:
    name: Publish verified Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: verify
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout code
        if: env.DOCKERHUB_USERNAME != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Download tested images
        if: env.DOCKERHUB_USERNAME != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: verified-image-*
          path: verified-images

      - name: Install OCI image transfer tool
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo

      - name: Set up Docker Buildx
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: env.DOCKERHUB_USERNAME != ''
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/stiva
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Publish the exact images tested by CI
        if: env.DOCKERHUB_USERNAME != ''
        env:
          IMAGE_NAME: ${{ env.DOCKERHUB_USERNAME }}/stiva
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: bash scripts/publish-verified-images.sh
