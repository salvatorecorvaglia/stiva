apiVersion: apps/v1
kind: Deployment
metadata:
  name: stiva
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stiva
  template:
    metadata:
      labels:
        app: stiva
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stiva
          image: corvaglia91/stiva
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: stiva-config
            - secretRef:
                name: stiva-secrets
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /_ready
              port: s3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_ready
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'wget -q -T 3 --tries=1 --spider http://127.0.0.1:9000/_health && wget -q -T 3 --tries=1 --spider http://127.0.0.1:9001/_health'
            periodSeconds: 20
            timeoutSeconds: 8
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stiva-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
