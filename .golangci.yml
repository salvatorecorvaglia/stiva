# ================================================================
# golangci-lint configuration for Stiva
# ================================================================

version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    # nilerr catches "if err != nil { ... }" blocks that fall through instead of
    # returning — the shape behind a latent nil dereference in the object
    # handlers, where a failed HeadObject carried on to read info.ContentType.
    - nilerr
    - noctx
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - os.Remove
        - os.RemoveAll
        - (*go.etcd.io/bbolt.DB).Close
        - (net.Listener).Close
        - (*net.TCPListener).Close
    gosec:
      excludes:
        # MD5 is required by S3 ETag and SSE-C key-MD5 specs.
        - G401
        - G501
        - G115
    revive:
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
        - name: increment-decrement
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - ineffassign
          - noctx
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
