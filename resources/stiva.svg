<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stiva-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="stiva-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="stiva-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="stiva-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#stiva-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="url(#stiva-accent)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Stacked Storage Cubes / S3 Layer Blocks -->
  <g transform="translate(256, 175)">
    <!-- Bottom Layer Stack -->
    <g transform="translate(0, 150)">
      <path d="M 0,-35 L 140,35 L 0,105 L -140,35 Z" fill="#065F46" opacity="0.8"/>
      <path d="M -140,35 L 0,105 L 0,140 L -140,70 Z" fill="#047857"/>
      <path d="M 140,35 L 0,105 L 0,140 L 140,70 Z" fill="#059669"/>
    </g>

    <!-- Middle Layer Stack -->
    <g transform="translate(0, 75)">
      <path d="M 0,-35 L 140,35 L 0,105 L -140,35 Z" fill="#047857" opacity="0.9"/>
      <path d="M -140,35 L 0,105 L 0,140 L -140,70 Z" fill="#10B981"/>
      <path d="M 140,35 L 0,105 L 0,140 L 140,70 Z" fill="#059669"/>
    </g>

    <!-- Top Storage Cube (Active Glowing Layer) -->
    <g transform="translate(0, 0)" filter="url(#stiva-glow)">
      <!-- Top Face -->
      <path d="M 0,-45 L 140,25 L 0,95 L -140,25 Z" fill="url(#stiva-top)"/>
      <!-- Left Face -->
      <path d="M -140,25 L 0,95 L 0,135 L -140,65 Z" fill="#10B981"/>
      <!-- Right Face -->
      <path d="M 140,25 L 0,95 L 0,135 L 140,65 Z" fill="#06B6D4"/>
    </g>

    <!-- S3 Storage Bucket Icon Overlay on Top Face -->
    <g transform="translate(0, 25) scale(0.6)">
      <ellipse cx="0" cy="-30" rx="60" ry="25" fill="none" stroke="#FFFFFF" stroke-width="8"/>
      <path d="M -60,-30 L -60,20 C -60,50 60,50 60,20 L 60,-30" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    </g>
  </g>
</svg>
